[project]
name = "task-adder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tretegg", email = "treteggyt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyright>=1.1.414",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sp-image-sync = "task_adder.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pyright]
typeCheckingMode = "standard"
